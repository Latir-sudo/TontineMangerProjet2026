<div class="page-shell login-shell">
  <section class="auth-card">
    <div class="auth-header">
      <span class="brand-pill">Connexion</span>
      <h1>Tontine-Manager</h1>
      <p>Connectez-vous pour continuer</p>
    </div>

    <form class="auth-form" (ngSubmit)="login()">
      <label>
        <span>Email</span>
        <input
          type="email"
          placeholder="example@email.com"
          [(ngModel)]="credentials.email"
          name="email"
          required
        />
      </label>

      <label>
        <span>Mot de passe</span>
        <input
          type="password"
          placeholder="********"
          [(ngModel)]="credentials.password"
          name="password"
          required
        />
      </label>

      <div class="auth-action-row">
        <a routerLink="/create">Mot de passe oublié ?</a>
      </div>

      <button class="primary-button" type="submit">Se connecter</button>
    </form>

    <p class="auth-footer">
      Pas de compte ? <a routerLink="/register">S’inscrire</a>
    </p>
  </section>
</div>
