<div class="min-h-screen bg-gray-50 p-4">
  <div class="max-w-md mx-auto">
    <button routerLink="/dashboard" class="text-[#003366] mb-4 flex items-center gap-1">
      ← Retour
    </button>
    
    <div class="bg-white rounded-xl shadow-md p-6">
      <h1 class="text-2xl font-bold text-[#003366] mb-2">Créer une tontine</h1>
      <p class="text-gray-500 text-sm mb-6">Remplissez les informations pour créer votre tontine</p>

      <form class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom de la tontine *</label>
          <input type="text" placeholder="Ex. Épargne solidaire" 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Catégorie *</label>
          <select class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-[#FF7F50] outline-none">
            <option value="">Sélectionnez une catégorie</option>
            <option>Épargne</option>
            <option>Investissement</option>
            <option>Sociale</option>
            <option>Solidaire</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Localité *</label>
          <select class="w-full p-3 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-[#FF7F50] outline-none">
            <option>Dakar</option>
            <option>Thiès</option>
            <option>Saint-Louis</option>
            <option>Touba</option>
            <option>Ziguinchor</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-[#FF7F50] text-white py-3 rounded-lg font-semibold hover:bg-opacity-90 transition">
          Créer la tontine
        </button>
      </form>
    </div>
  </div>
</div>
