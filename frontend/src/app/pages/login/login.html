<h2 class="text-xl text-center mb-4 mt-5 text-[#003366] font-bold">Bienvenue à 
    <span class="text-[#FF7F50] ">Tontine Manager</span></h2>
<div class="min-h-screen flex items-center justify-center bg-[#F4F4F4] py-12 px-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <i class="ri-hand-coin-line text-4xl text-[#003366]"></i>
      <h2 class="mt-4 text-3xl font-bold text-[#003366]">Connexion</h2>
      <p class="mt-2 text-gray-600">Accédez à votre espace tontine</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email"
          required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none"
          placeholder="exemple@email.com"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password"
          required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none"
          placeholder="••••••••"
        >
      </div>

      <div *ngIf="errorMessage" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm">
        {{ errorMessage }}
      </div>

      <button 
  type="submit" 
  [disabled]="isLoading" 
  class="w-full bg-[#FF7F50] text-white py-3 rounded-lg font-semibold hover:bg-opacity-90 transition"
>
  {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
</button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Pas encore de compte ?
      <a routerLink="/inscription" class="text-[#003366] font-semibold hover:underline">S'inscrire</a>
    </p>
    
    <p class="mt-4 text-center text-xs text-gray-400">
      Démo : admin@tontine.com / admin123
    </p>
  </div>
</div>

<footer class="w-full h-55 bg-[#003366]">

</footer>
