<div class="min-h-screen bg-gray-50">
  <!-- Header -->
  <header class="bg-[#003366] text-white p-4 shadow-lg">
    <div class="container mx-auto">
      <h1 class="text-2xl font-bold">Bonjour, Amadou</h1>
      <p class="text-blue-100">Gérez vos tontines facilement</p>
    </div>
  </header>

  <main class="container mx-auto p-4 space-y-6">
    <!-- Carte total cotisé -->
    <div class="bg-white rounded-2xl shadow-md p-6 border-l-8 border-[#FF7F50]">
      <p class="text-gray-500 text-sm">Total cotisé</p>
      <p class="text-3xl font-bold text-[#003366]">245 000 F</p>
    </div>

    <!-- Actions rapides -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
      <button routerLink="/tontine/create" class="bg-[#003366] text-white py-3 rounded-lg text-sm font-medium">
        Créer tontine
      </button>
      <button routerLink="/historique" class="bg-[#003366] text-white py-3 rounded-lg text-sm font-medium">
        Historique
      </button>
      <button class="bg-[#FF7F50] text-white py-3 rounded-lg text-sm font-medium">
        Rejoindre
      </button>
      <button class="bg-red-600 text-white py-3 rounded-lg text-sm font-medium">
        Quitter
      </button>
    </div>

    <!-- Mes tontines -->
    <div>
      <h2 class="text-xl font-semibold text-[#003366] mb-4">Mes tontines</h2>
      <div class="space-y-3">
        <div class="bg-white rounded-xl shadow-sm p-4 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-gray-800">Tontine Famille</h3>
            <p class="text-sm text-gray-500">12 membres</p>
          </div>
          <span class="text-xs bg-orange-100 text-[#FF7F50] px-2 py-1 rounded-full">
            Paiement dans 3 jours
          </span>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-4 flex justify-between items-center">
          <div>
            <h3 class="font-bold text-gray-800">Épargne Quartier</h3>
            <p class="text-sm text-gray-500">20 membres</p>
          </div>
          <span class="text-xs bg-orange-100 text-[#FF7F50] px-2 py-1 rounded-full">
            Paiement dans 1 jour
          </span>
        </div>
      </div>
    </div>
  </main>
</div>
