<h2 class="text-xl text-center mb-4 mt-5 text-[#003366] font-bold">Bienvenue à 
    <span class="text-[#FF7F50] ">Tontine Manager</span></h2>

<div class="min-h-screen flex items-center justify-center bg-gray-50 py-12 px-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-8">
      <div class="text-5xl mb-2">💰</div>
      <h2 class="text-3xl font-bold text-[#003366]">Inscription</h2>
      <p class="mt-2 text-gray-600">Rejoignez la communauté Tontine Manager</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
          <input 
            type="text" 
            [(ngModel)]="userData.nom" 
            name="nom"
            required
            class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none"
          >
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Prénom *</label>
          <input 
            type="text" 
            [(ngModel)]="userData.prenom" 
            name="prenom"
            required
            class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none"
          >
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
        <input 
          type="email" 
          [(ngModel)]="userData.email" 
          name="email"
          required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none"
          placeholder="exemple@email.com"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Téléphone *</label>
        <input 
          type="tel" 
          [(ngModel)]="userData.telephone" 
          name="telephone"
          required
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none"
          placeholder="77 123 45 67"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Localité *</label>
        <select 
          [(ngModel)]="userData.localite" 
          name="localite"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none bg-white"
        >
          <option *ngFor="let loc of localites" [value]="loc">{{ loc }}</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe *</label>
        <input 
          type="password" 
          [(ngModel)]="userData.password" 
          name="password"
          required
          minlength="6"
          class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#FF7F50] focus:border-[#FF7F50] outline-none"
          placeholder="Minimum 6 caractères"
        >
      </div>

      <div *ngIf="errorMessage" class="bg-red-100 text-red-700 p-3 rounded-lg text-sm">
        ❌ {{ errorMessage }}
      </div>
      <div *ngIf="successMessage" class="bg-green-100 text-green-700 p-3 rounded-lg text-sm">
        ✅ {{ successMessage }} Redirection...
      </div>

     <button type="submit" [disabled]="isLoading" class="w-full bg-[#FF7F50] text-white py-3 rounded-lg font-semibold hover:bg-opacity-90 transition">
  {{ isLoading ? 'Inscription en cours...' : "S'inscrire" }}
     </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Déjà un compte ?
      <a routerLink="/login" class="text-[#003366] font-semibold hover:underline">Se connecter</a>
    </p>
  </div>
</div>
